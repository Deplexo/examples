version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/templates/nextjs-portfolio", "/templates/nextjs-website", "/templates/node-express"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directories: ["/templates/go-telegram-bot", "/templates/go-discord-bot", "/templates/go-http-api"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /templates/python-fastapi
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/templates/*"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
